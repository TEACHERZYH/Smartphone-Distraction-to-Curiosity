[platformio]
default_envs = vlc_tx, csi_tx, csi_rx

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; =====================================================================
; Environment 1: Visible Light Communication (VLC/OCC) Transmitter
; Target: ESP32 / ESP32-S3 Core Board
; Hardware: GPIO4 -> MOSFET Driver -> 3W High-Power White LED
; =====================================================================
[env:vlc_tx]
board = esp32dev
build_src_filter = +<vlc_transmitter/src/*>
build_flags = 
    -D VLC_TX_NODE=1
    -I vlc_transmitter/include

; =====================================================================
; Environment 2: Wi-Fi CSI RF Transmitter (SoftAP / 100 Hz Probe Beacon)
; Target: ESP32-S3-DevKitC-1
; =====================================================================
[env:csi_tx]
board = esp32-s3-devkitc-1
build_src_filter = +<wifi_csi_transmitter/src/*>
build_flags = 
    -D CSI_TX_NODE=1
    -D CORE_DEBUG_LEVEL=3

; =====================================================================
; Environment 3: Wi-Fi CSI RF Receiver (STA / 52 Subcarriers Extraction)
; Target: ESP32-S3-DevKitC-1 (USB-UART to Processing PC)
; =====================================================================
[env:csi_rx]
board = esp32-s3-devkitc-1
build_src_filter = +<wifi_csi_receiver/src/*>
build_flags = 
    -D CSI_RX_NODE=1
    -I wifi_csi_receiver/include
    -D CORE_DEBUG_LEVEL=3
